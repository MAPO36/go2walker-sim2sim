# =============================================================================
# go2.yaml -- Sim2Sim (MuJoCo) configuration for Unitree Go2
#
# Hand-written for deploy/deploy_mujoco/deploy_mujoco.py.
# The official repo (upstream master, commit 276801e) ships g1.yaml / h1.yaml /
# h1_2.yaml only: there is no official go2.yaml, no pre-trained go2 policy
# (deploy/pre_train/go2/) and no go2 MuJoCo scene. Every number below is taken
# from the repository's own Go2 training config so that Sim2Sim matches what the
# policy was trained with:
#     legged_gym/envs/go2/go2_config.py    (GO2RoughCfg)
#     legged_gym/envs/base/legged_robot_config.py (LeggedRobotCfg)
#
# -----------------------------------------------------------------------------
# Status of the three prerequisites this file used to list:
#
# 1) Policy -- DONE. policy_path points at a network exported by play.py. It must
#    be an ACTOR trained by '--task=go2'. Check the file names:
#      logs/<experiment>/exported/policies/policy_1.pt       (MLP actor)
#      logs/<experiment>/exported/policies/policy_lstm_1.pt  (RNN actor)
#    An RNN export is NOT loadable here: deploy_mujoco.py feeds the network a
#    single frame and has no hidden state to carry across steps.
#
# 2) MuJoCo scene -- DONE. resources/robots/go2/ contains go2.xml, scene.xml and
#    the meshes/ directory holding the 16 .obj files that go2.xml declares via
#    its meshdir="meshes". All three must be present or MjModel.from_xml_path()
#    fails with "Error opening file ...".
#
# 3) Observation layout -- DONE, via 'observation_layout: quadruped' below.
#    deploy_mujoco.py builds its observation vector in one of two orders, and the
#    config has to name the one the policy was trained with:
#      humanoid  (g1, h1, h1_2)   11 + 3 * num_actions = 47
#        [ang_vel(3), gravity(3), cmd(3), dof_pos(12), dof_vel(12),
#         last_action(12), sin_phase, cos_phase]
#        -> legged_gym/envs/g1/g1_env.py::compute_observations
#      quadruped (go2)            12 + 3 * num_actions = 48
#        [lin_vel(3), ang_vel(3), gravity(3), cmd(3), dof_pos(12), dof_vel(12),
#         last_action(12)]
#        -> legged_gym/envs/base/legged_robot.py::compute_observations, which
#           GO2RoughCfg inherits: the Go2 task still uses the legacy base
#           observation, so it has no phase input and DOES observe base linear
#           velocity.
#    A 48-dim go2 policy fed the 47-dim layout raises a TorchScript shape error;
#    even if the widths are fudged, every slot after the first three is shifted.
#    Hence num_obs: 48 and observation_layout: quadruped.
#
# IMPORTANT: deploy_mujoco.py opens this file with open(..., "r") and no
# explicit encoding, and Python then uses the system locale codec (GBK/cp936 on
# a Chinese Windows install). Keep this file ASCII-only, otherwise it may fail
# to load. Same reason the other configs carry no Chinese comments.
# =============================================================================


# Path of the exported actor network (torch.jit .pt) and of the MuJoCo scene.
policy_path: "/home/ubuntu/B4_2025/unitree_rl_gym/logs/go2_1/exported/policies/policy_1.pt"
xml_path: "{LEGGED_GYM_ROOT_DIR}/resources/robots/go2/scene.xml"

# Total simulation time
simulation_duration: 60.0
# Simulation time step
simulation_dt: 0.002
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
# Matches training: decimation 4 * sim dt 0.005 s = 0.02 s = 50 Hz
control_decimation: 10

# PD gains -- must equal the training gains, because the training torque law
# (legged_robot.py: tau = kp*(action*action_scale + default - q) - kd*dq) is
# reproduced exactly by pd_control() in deploy_mujoco.py.
# go2_config.py: stiffness = {'joint': 20.}, damping = {'joint': 0.5}, and
# legged_robot.py applies those to every dof whose name matches 'joint', i.e.
# all 12 leg joints get the same gain.
kps: [20, 20, 20, 20, 20, 20,
      20, 20, 20, 20, 20, 20]
kds: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5,
      0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

# Default joint angles [rad] = go2_config.py init_state.default_joint_angles.
# ORDER = the DOF order of resources/robots/go2/urdf/go2.urdf (which Isaac Gym
# and therefore the trained policy use, legged_robot.py indexes p_gains /
# default_dof_pos by dof name):
#   FL_hip, FL_thigh, FL_calf, FR_hip, FR_thigh, FR_calf,
#   RL_hip, RL_thigh, RL_calf, RR_hip, RR_thigh, RR_calf
# Note the asymmetric stance: front thigh 0.8, rear thigh 1.0, all calves -1.5.
# target_dof_pos = action * action_scale + default_angles (see action_scale).
# go2.xml orders its 12 joints and its 12 actuators the same way, which is what
# lets deploy_mujoco.py use a plain d.qpos[7:] / d.ctrl[:] mapping.
default_angles: [0.1, 0.8, -1.5,
                 -0.1, 0.8, -1.5,
                 0.1, 1.0, -1.5,
                 -0.1, 1.0, -1.5]

# Base spawn height [m] = go2_config.py init_state.pos. deploy_mujoco.py starts
# the free joint here and puts every leg joint at default_angles, i.e. the same
# reset state the policy was trained from; the robot then drops the few
# centimetres onto the ground exactly as it did in Isaac Gym.
base_position: [0.0, 0.0, 0.42]

# Observation layout -- see prerequisite 3 at the top of this file.
observation_layout: quadruped
# Observation scales -- equal to LeggedRobotCfg.normalization.obs_scales.
lin_vel_scale: 2.0
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
# commands_scale = [obs_scales.lin_vel, obs_scales.lin_vel, obs_scales.ang_vel]
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 12
# 12 + 3 * num_actions = 48, the quadruped layout above (11 + 3*num_actions = 47
# if you ever switch observation_layout back to humanoid).
num_obs: 48

# Initial velocity command [vx, vy, wz]; 0.5 m/s forward stays inside the go2
# training range lin_vel_x = [-1.0, 1.0].
cmd_init: [0.5, 0, 0]
